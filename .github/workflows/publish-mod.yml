# Publishes the mod to Modrinth when mod/ changes on main.
# The version comes from `version=` in mod/gradle.properties. If that version is already on Modrinth the run does nothing,
# so bump it (and add a CHANGELOG entry) when you want to release.
# Needs repo secret MODRINTH_TOKEN and repo variable MODRINTH_PROJECT_ID.
name: Publish mod
on:
  push:
    branches: [main]
    paths: ['mod/**', '.github/workflows/publish-mod.yml']
  workflow_dispatch:
concurrency: publish-mod
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version and check Modrinth
        id: v
        env:
          PROJECT: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          VERSION=$(grep -E '^version=' mod/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -z "$PROJECT" ]; then echo "::error::Add the repository variable MODRINTH_PROJECT_ID."; exit 1; fi
          if curl -sSf "https://api.modrinth.com/v2/project/${PROJECT}/version" | jq -e --arg v "$VERSION" 'map(select(.version_number == $v)) | length > 0' > /dev/null; then
            echo "Version $VERSION is already on Modrinth. Bump version= in mod/gradle.properties to release a new one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.v.outputs.skip != 'true'
        with: { distribution: temurin, java-version: 25 }
      - name: Build
        if: steps.v.outputs.skip != 'true'
        working-directory: mod
        run: chmod +x gradlew && ./gradlew build
      - name: This version's changelog only
        if: steps.v.outputs.skip != 'true'
        # The newest "## x.y.z" section of mod/CHANGELOG.md, without its heading (older versions are already on their own Modrinth pages)
        run: awk '/^## /{n++; if (n==1) next} n==1' mod/CHANGELOG.md > mod/release-notes.md && cat mod/release-notes.md
      - uses: Kir-Antipov/mc-publish@v3.3
        if: steps.v.outputs.skip != 'true'
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: mod/build/libs/!(*-@(dev|sources|javadoc)).jar
          name: Survival Notebook ${{ steps.v.outputs.version }}
          version: ${{ steps.v.outputs.version }}
          version-type: release
          changelog-file: mod/release-notes.md
          loaders: fabric
          game-versions: "26.3"
          java: "25"
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
