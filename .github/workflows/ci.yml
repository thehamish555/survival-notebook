name: CI
# Checks every push and pull request. Deploys are separate: Vercel builds the site, deploy-api.yml restarts the API, publish-mod.yml ships the mod.
# Branches: work happens on dev (a Vercel preview site, plus a test mod jar attached to this run); merging dev into main is a release.
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { API_ORIGIN: "https://notebook-api.hamish555.com" }
  mod:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mod } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - run: chmod +x gradlew && ./gradlew build
      - name: Test jar for dev builds (download it from the run's Artifacts; main releases go to Modrinth instead)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: survival-notebook-${{ github.ref_name }}-${{ github.sha }}
          path: mod/build/libs/*.jar
          retention-days: 14
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 shared/build-enchants.py && git diff --exit-code   # the site's and the mod's copies of the rules must match
